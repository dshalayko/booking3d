# Локальная разработка: в контейнере только БД, приложение запускается с хоста
# (PyCharm или uvicorn app.main:app --reload).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: ${TZ:-Europe/Nicosia}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
